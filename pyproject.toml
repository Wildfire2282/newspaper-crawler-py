[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newspaper-crawler"
version = "3.2.0"
description = "人民日报 / 光明日报 / 经济日报 / 大众日报电子报批量下载"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Wildfire2282", email = "289496920+Wildfire2282@users.noreply.github.com" },
]
keywords = ["newspaper", "crawler", "epaper", "scraper", "人民日报", "光明日报"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[dependency-groups]
# PEP 735 dependency group: `uv sync` installs it by default; `uv sync --no-dev` skips it.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
newspaper-crawler = "newspaper_crawler.cli:main"

[project.urls]
Homepage = "https://github.com/Wildfire2282/newspaper-crawler-py"
Repository = "https://github.com/Wildfire2282/newspaper-crawler-py"
Issues = "https://github.com/Wildfire2282/newspaper-crawler-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["newspaper_crawler"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Only rules that catch real defects. UP and parts of B encode style preferences that
# conflict with the existing conventions here, so they stay off.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = [
    # zip() without explicit strict=: the parallel fetch results are equal in length
    # to the inputs by construction.
    "B905",
]

[tool.mypy]
python_version = "3.12"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Site parsers rely on BeautifulSoup's dynamic attribute types (an attribute value may
# be str | AttributeValueList). Static checking there yields little and a lot of noise,
# so mypy is disabled for those modules.
[[tool.mypy.overrides]]
module = "newspaper_crawler.sites.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --cov=newspaper_crawler --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["newspaper_crawler"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
